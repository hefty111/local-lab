name: litellm-local

x-litellm-env: &litellm-env
  DATABASE_URL: postgresql://llmproxy:dbpassword9090@pgbouncer:5432/litellm?pgbouncer=true
  LITELLM_MASTER_KEY: sk-1234
  LITELLM_SALT_KEY: sk-salt-local-1234
  STORE_MODEL_IN_DB: "True"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  S3_ENDPOINT_URL: http://minio:9000
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  AWS_REGION_NAME: us-east-1

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: dbpassword9090
    volumes:
      - litellm_local_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmproxy -d litellm"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [litellm-net]

  pgbouncer:
    image: edoburu/pgbouncer:latest
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: llmproxy
      DB_PASSWORD: dbpassword9090
      DB_NAME: litellm
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "20"
      ADMIN_USERS: llmproxy
      STATS_USERS: llmproxy
      LISTEN_PORT: "5432"
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U llmproxy"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [litellm-net]

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - litellm_local_pgadmindata:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      pgbouncer:
        condition: service_healthy
    networks: [litellm-net]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [litellm-net]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - litellm_local_miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [litellm-net]

  minio-init:
    image: minio/mc:latest
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/litellm-spend-logs &&
      exit 0
      "
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks: [litellm-net]

  mock-llm:
    build:
      context: ..
      dockerfile: benchmark-litellm/mock-llm/Dockerfile
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8090/health').status==200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [litellm-net]

  litellm-migrate:
    image: litellm-local:v1.98.0-premium-override
    build:
      context: ./premium-override/1.98.0
    working_dir: /app
    # The image ENTRYPOINT is prod_entrypoint.sh (exec litellm "$@"); override it to run
    # the migration script directly, matching the Helm migrations Job.
    entrypoint: ["python", "litellm/proxy/prisma_migration.py"]
    environment:
      <<: *litellm-env
      DISABLE_SCHEMA_UPDATE: "false"
    restart: "no"
    depends_on:
      pgbouncer:
        condition: service_healthy
    networks: [litellm-net]

  litellm:
    image: litellm-local:v1.98.0-premium-override
    build:
      context: ./premium-override/1.98.0
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      <<: *litellm-env
      DISABLE_SCHEMA_UPDATE: "true"
    volumes:
      - ./proxy_config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"
    depends_on:
      litellm-migrate:
        condition: service_completed_successfully
      mock-llm:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      # the image has no curl; use python
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness').status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [litellm-net]

volumes:
  litellm_local_pgdata:
  litellm_local_miniodata:
  litellm_local_pgadmindata:

networks:
  litellm-net:
