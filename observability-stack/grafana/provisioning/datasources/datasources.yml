apiVersion: 1

datasources:
  - name: LiteLLM Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: LiteLLM Postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: llmproxy
    secureJsonData:
      password: dbpassword9090
    jsonData:
      database: litellm
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    editable: true
